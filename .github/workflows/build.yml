name: Build Windows x64
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: .\build.ps1
      - name: Package v1.0
        shell: powershell
        run: .\tools\package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BH-Editor-v1.0-win64
          path: |
            dist/BH-Editor-v1.0-win64.zip
            dist/BH-Editor-v1.0-win64.zip.sha256
          if-no-files-found: error
